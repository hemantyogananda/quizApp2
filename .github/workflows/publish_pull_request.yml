name: Publish Pull Request
on: 
  push:
    branches:
      - develop
      - 'feature/**'
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
          contents : read
          pull-requests: write
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with: 
              node-version: 20
          - name: Setup Expo
            uses: expo/expo-github-action@v8
            with:
              expo-cache: true
              eas-version: latest
              token: ${{ secrets.EXPO_TOKEN }}
          - name: 📝 Configure Git safe directory
            run: git config --global --add safe.directory $GITHUB_WORKSPACE
          - name: 📦 Install dependencies
            run: npm install
          - name: Setup EAS
            uses: expo/expo-github-action@v8
            with:
              eas-version: latest
              token: ${{ secrets.EXPO_TOKEN }}
          - name: 📦 Publish to Expo Go
            run: eas build --profile development --platform android
          - name: Create preview
            uses: expo/expo-github-action/preview@v8
            with:
              command: eas update --auto
          
          - name: Add Expo link to PR
            uses: mshick/add-pr-comment@v2
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              message: |
                ## Test this PR with Expo Go
                ![Expo QR](https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=exp://exp.dev/accounts/hemant08/projects/quizapp/builds/8ea15a44-06e8-41d0-bab5-a950598ff1a1)
                **------ Build published to [Expo](https://exp.dev/accounts/hemant08/projects/quizapp/builds/8ea15a44-06e8-41d0-bab5-a950598ff1a1) ------**